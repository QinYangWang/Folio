name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Validate registry
        run: node tests/design-rules.mjs && node tests/theme.mjs && node tests/registry.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check production site under /Folio/
        shell: bash
        run: |
          npm run preview -- --mode pages --host 127.0.0.1 --port 4173 > /tmp/folio-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/Folio/ > /dev/null; then break; fi
            sleep 1
          done
          export FOLIO_TEST_URL=http://127.0.0.1:4173/Folio
          node tests/smoke.mjs
          node tests/motion.mjs
          node tests/components.mjs
          node tests/components-layout.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
